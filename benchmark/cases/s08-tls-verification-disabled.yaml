id: s08-tls-verification-disabled
kind: security
title: Fetch invoices from billing service
body: The internal billing service uses a self-signed certificate.
files:
  - path: app/client.py
    head: |
      import requests


      def fetch_invoice(invoice_id: str) -> dict:
          response = requests.get(f"https://billing.internal/invoices/{invoice_id}", verify=False, timeout=10)
          response.raise_for_status()
          return response.json()
labels:
  - file: app/client.py
    lines: [5, 5]
    categories: [insecure_config]
    note: "verify=False disables TLS certificate checks (MITM); pin the internal CA instead"
