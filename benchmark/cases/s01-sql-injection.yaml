id: s01-sql-injection
kind: security
title: Look up users by username
body: Needed by the new admin page.
files:
  - path: app/db.py
    head: |
      import sqlite3


      def find_user(conn: sqlite3.Connection, username: str):
          query = f"SELECT id, email FROM users WHERE username = '{username}'"
          return conn.execute(query).fetchone()
labels:
  - file: app/db.py
    lines: [5, 6]
    categories: [injection]
    note: "username is interpolated into SQL; use a parameterised query"
