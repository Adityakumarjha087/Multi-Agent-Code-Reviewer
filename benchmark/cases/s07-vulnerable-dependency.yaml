id: s07-vulnerable-dependency
kind: security
title: Add YAML support
body: Pins PyYAML for the config loader.
files:
  - path: requirements.txt
    base: |
      # runtime dependencies
    head: |
      # runtime dependencies
      pyyaml==5.3
labels:
