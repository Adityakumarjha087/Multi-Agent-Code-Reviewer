# Unit tests and benchmark-label validation on every push and pull request.
# No secrets are needed: LLM paths are exercised with test doubles. Docker/network/Postgres
# integration tests run locally with `make test-all`.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag (refs/tags/v10 returns 404), so pin the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.9"
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt -e .
      - name: Unit tests
        run: .venv/bin/python -m pytest -q tests/unit
      - name: Validate benchmark labels
        run: .venv/bin/python -m prreview.bench validate
